version: '3.8'

services:
  ircd:
    image: ghcr.io/ergochat/ergo:stable
    container_name: irc-client-test-server
    ports:
      - "6667:6667"
      - "6697:6697"
    volumes:
      - ./ircd.yaml:/ircd/ircd.yaml:ro
      - ./ergo.motd:/ircd/ergo.motd:ro
      - ircd-data:/ircd
    restart: unless-stopped
    init: true

volumes:
  ircd-data: