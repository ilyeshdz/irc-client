# Standard Release Drafter config: maintains the draft notes for the next
# stable release on every push to main. Base is the latest stable tag
# (prereleases like `nightly` are excluded), so the draft always reflects
# "what will ship in the next version".
#
# This only works if changes land via pull requests with changelog labels,
# see AGENTS.md. Direct pushes to main are invisible to Release Drafter.
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    semver-increment: minor
    when:
      labels: ['feature', 'enhancement']
  - title: 'Bug Fixes'
    when:
      labels: ['fix', 'bugfix', 'bug']
  - title: 'Maintenance'
    when:
      labels: ['chore', 'dependencies', 'ci']
  # Catches unlabeled PRs so nothing merged ever goes missing.
  - title: 'Other changes'
  - type: pre-exclude
    when:
      labels: ['skip-changelog']

change-template: '- $TITLE (#$NUMBER) $AUTHORS'

no-changes-template: '* No changes'

template: |
  ## Changes

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
