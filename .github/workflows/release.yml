name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            archive: x86_64-linux
          - target: aarch64-linux-musl
            archive: aarch64-linux
          - target: x86_64-macos
            archive: x86_64-macos
          - target: aarch64-macos
            archive: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip \
            -Dtarget=${{ matrix.target }} \
            -Dversion=${GITHUB_REF_NAME#v}

      - name: Package
        run: |
          stage=irc_client-${GITHUB_REF_NAME#v}-${{ matrix.archive }}
          mkdir "$stage"
          cp zig-out/bin/irc_client "$stage/"
          cp README.md LICENSE "$stage/"
          tar czf "$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
