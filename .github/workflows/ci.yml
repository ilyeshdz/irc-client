name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache zig
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'src/**/*.zig') }}
          restore-keys: zig-${{ runner.os }}-

      - name: Check formatting
        run: zig fmt --check .

      # fmt only parses; ast-check also catches unused locals and shadowed
      # names, which is where most of our mistakes actually come from.
      - name: Lint
        run: |
          for f in $(find src -name '*.zig'); do
            zig ast-check "$f"
          done

      - name: Test
        run: zig build test

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      # We only claim Unix support, so make sure the POSIX assumptions hold
      # somewhere other than the host we happen to be building on.
      - name: Cross-compile (Linux musl)
        run: |
          zig build -Dtarget=x86_64-linux-musl
          zig build -Dtarget=aarch64-linux-musl
