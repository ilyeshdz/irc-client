<config format="xml">
  <server name="test.local"
          description="Test IRC Server"
          network="TestNet"
          id="00A">
    <admin name="Test Admin"
           nick="TestAdmin"
           email="admin@test.local"/>
    <bind address="" port="6667" type="clients"/>
    <bind address="" port="6697" type="clients" ssl="gnutls"/>
    <power diepass="secret" restartpass="secret" pause="2"/>
    <connect allow="*"
             timeout="60"
             flood="20"
             threshold="1"
             pingfreq="120"
             sendq="100000"
             recvq="8000"
             localmax="100"
             globalmax="10000"/>
    <channel users="50"
             opers="10"
             maxmodes="20"
             maxbans="50"
             deletenotopic="yes"
             forcedpartmsg="no"/>
    <dns>
      <resolve host="localhost" address="127.0.0.1"/>
    </dns>
    <files motd="/etc/inspircd/inspircd.motd"
           rules="/etc/inspircd/inspircd.rules"
           opermotd="/etc/inspircd/opermotd"/>
    <security
      announceinvites="yes"
      hideulines="yes"
      flatlinks="no"
      hidewhois="no"
      customversion="Test IRC Server"
      hidemodes="no"
      hidekills="no"
      hideparts="no"
      hidequits="no"
      hidebans="no"
      hideoper="no"
      maxtargets="20"/>
    <performance netbuffersize="10240"
                 maxwho="100"
                 somaxconn="128"
                 sendq="100000"
                 recvq="8000"
                 queue="50"
                 softlimit="512"
                 hardlimit="1024"/>
    <badnik nick="*bot*" reason="Bots not allowed"/>
    <badnick nick="*spam*" reason="Spam not allowed"/>
    <badident ident="*root*" reason="Reserved ident"/>
    <badident ident="*admin*" reason="Reserved ident"/>
    <module name="m_spanningtree.so"/>
    <module name="m_md5.so"/>
    <module name="m_sha256.so"/>
    <module name="m_ssl_gnutls.so"/>
    <module name="m_globops.so"/>
    <module name="m_httpd.so"/>
    <module name="m_http_stats.so"/>
    <module name="m_http_server.so"/>
    <module name="m_http_api.so"/>
    <httpd name="stats" port="8080" bind="">
      <listen address="0.0.0.0" port="8080"/>
    </httpd>
    <uline server="services.test.local" silent="no"/>
  </server>
</config>